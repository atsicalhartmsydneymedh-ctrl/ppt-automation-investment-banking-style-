version: 1.0
use_when: mechanism_registry返回多个近似候选

rules:
  - candidates: [R1-L01, R3-L03, R3-L08, R3-L11]
    choose:
      R1-L01: 两个不同命题共同支撑总论点，不要求共同运营结果
      R3-L03: 两套不同系统直接共同产生一个结果
      R3-L08: 两类渠道分别证明同一覆盖/销售策略，不要求互通
      R3-L11: 两条行动路径各有不同动作与产出，共同通向目标

  - candidates: [R2-L05, R2-L07, R3-L01, R1-L26]
    choose:
      R2-L05: 恰好三项互补能力共同支撑主体
      R2-L07: 3–6项独立支持能力围绕同一受益对象
      R3-L01: 一个主体下面有多类具体对象，并强调归属/生态覆盖
      R1-L26: 多个杠杆彼此增强，存在真实反馈

  - candidates: [R1-L03, R2-L11, R2-L12, R2-L15]
    choose:
      R1-L03: 宏观阶段与离散里程碑共享时间轴
      R2-L11: 围绕明确目标日期倒排少量关键节点
      R2-L12: 多团队并行任务、持续期和依赖需要审计
      R2-L15: 重点是阶段与角色/责任的二维核读

  - candidates: [R1-L12, R3-L04, R2-L20]
    choose:
      R1-L12: 多参与方、多流类型沿阶段传递
      R3-L04: 多环节受一项共同底座横向赋能
      R2-L20: 同一流程在规则变化前后的节点增删/顺序变化

  - candidates: [R1-L16, R2-L10, R2-L19]
    choose:
      R1-L16: 市场层级、价值差和对象定位
      R2-L10: 多项增量逐级累积到更高总价值
      R2-L19: 不同对象按贡献类型分级，并与累计需求关联

  - candidates: [R1-L18, R2-L14, R1-L25]
    choose:
      R1-L18: 长序列本身是主要证据，辅以简短结构解释
      R2-L14: 重点比较多个有起止日期的事件窗口
      R1-L25: 重点解释数值变化背后的驱动因素

  - candidates: [R1-L19, R2-L18, R2-L06]
    choose:
      R1-L19: 一个主体分别为两类对象创造不同价值
      R2-L18: 两方立场存在利益张力和可协商区间
      R2-L06: 两类渠道存在双向导流或履约互通

  - candidates: [R1-L06, R1-L10]
    choose:
      R1-L06: 一项实体/系统资产本身支撑多项能力
      R1-L10: 技术平台先产生能力，再由成果验证

  - candidates: [R3-L05, R2-L11, R2-L10]
    choose:
      R3-L05: 阶段代表能力攀升或突破
      R2-L11: 阶段代表接近目标日期
      R2-L10: 阶段代表价值逐级增加

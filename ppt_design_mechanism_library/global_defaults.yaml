schema_version: 3.0
purpose: 供AI按关系检索并复用排版机制

matching_order:
  - 分页完成后先生成page_structure，只保留内容组关系、顺序、映射、容量和证据形态
  - 使用执行卡match_signature执行硬门槛匹配
  - 多个机制同时命中时，依次选择A级、所需适配最少、来源证据更完整者
  - 区域比例是命中后的自适应参数，不参与硬匹配
  - 不得按行业、品牌、来源页关键词、具体色调或视觉外观直接匹配

global_style:
  cjk_font: KaiTi
  latin_numeric_font: Arial
  boundary_rule: 边界只在减少误读时使用；默认优先留白、对齐、底色和细线
  avoid: [无意义卡片墙, 按钮感, 玻璃, 发光, 伪3D, 为对称虚构内容]

global_asset_policy:
  - 结构优先使用PPT原生形状并保持可编辑
  - 项目特定照片、Logo、人物和案例图不进入通用素材库
  - 图片必须承担证据或空间结构作用
  - 数据图表必须保持口径可核验

global_qa:
  - 删除行业名词后关系仍成立
  - 每个视觉编码都有明确语义
  - 主次权重来自内容而非模板惯性
  - 不因反AI要求破坏必要的矩阵、流程或审计边界
  - 标题单行；中文楷体；英文与数字Arial
